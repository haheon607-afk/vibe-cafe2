<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 문서의 문자 인코딩 설정 (한글 깨짐 방지) -->
  <meta charset="UTF-8">
  <!-- 모바일 및 다양한 기기 화면 크기에 맞게 반응형으로 표시 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 주문서</title>

  <!-- 외부 CSS 스타일시트 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 전체 화면을 감싸는 컨테이너 박스 -->
  <div class="container">

    <!-- [페이지 상단] 카페 헤더 영역 -->
    <header class="cafe-header">
      <!-- 카페 로고 이모지 -->
      <div class="logo">☕</div>
      <!-- 카페 이름 -->
      <h1 class="title">바이브 카페</h1>
      <!-- 카페 부제 -->
      <p class="subtitle">당신의 하루에 바이브를 더하다</p>
    </header>

    <!-- [탭 메뉴] 주문하기 / 주문 내역 전환 -->
    <nav class="tab-menu">
      <button type="button" class="tab-btn active" id="tab-order-btn">☕ 주문하기</button>
      <button type="button" class="tab-btn" id="tab-history-btn">
        📋 주문 내역 <span id="order-badge" class="badge">0</span>
      </button>
    </nav>

    <!-- ==========================================
         [탭 1: 주문하기 화면]
         주문서 입력 폼과 주문 확인 메시지가 위치합니다.
    =========================================== -->
    <section id="order-tab" class="tab-content">

      <!-- 주문서 폼 영역
           novalidate: 브라우저 기본 경고창 대신 JavaScript로 직접 유효성 검사를 진행합니다 -->
      <form id="order-form" novalidate>

        <!-- 1. 이름 입력 (필수) -->
        <div class="form-group">
          <label for="customer-name">이름 <span class="required">*</span></label>
          <input type="text" id="customer-name" name="customerName" placeholder="주문하시는 분의 성함을 입력하세요">
        </div>

        <!-- 2. 전화번호 입력 -->
        <div class="form-group">
          <label for="customer-phone">전화번호</label>
          <input type="tel" id="customer-phone" name="customerPhone" placeholder="010-1234-5678">
        </div>

        <!-- 3. 음료 선택 (드롭다운 메뉴) -->
        <div class="form-group">
          <label for="drink-select">음료 선택</label>
          <select id="drink-select" name="drink">
            <option value="" data-price="0">-- 음료를 선택하세요 --</option>
            <option value="americano" data-price="3500">아메리카노 (3,500원)</option>
            <option value="latte" data-price="4000">카페라떼 (4,000원)</option>
            <option value="mocha" data-price="4500">카페모카 (4,500원)</option>
            <option value="vanilla-latte" data-price="4500">바닐라라떼 (4,500원)</option>
            <option value="green-tea-latte" data-price="4500">녹차라떼 (4,500원)</option>
          </select>
        </div>

        <!-- 4. 사이즈 선택 (라디오 버튼) -->
        <div class="form-group">
          <label class="group-title">사이즈</label>
          <div class="radio-group">
            <input type="radio" id="size-s" name="size" value="S" data-price="0">
            <label for="size-s">S (+0원)</label>

            <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
            <label for="size-m">M (+500원)</label>

            <input type="radio" id="size-l" name="size" value="L" data-price="1000">
            <label for="size-l">L (+1,000원)</label>
          </div>
        </div>

        <!-- 5. 추가 옵션 (체크박스) -->
        <div class="form-group">
          <label class="group-title">추가 옵션</label>
          <div class="checkbox-group">
            <input type="checkbox" id="option-shot" name="options" value="shot" data-price="500">
            <label for="option-shot">샷 추가 (+500원)</label>

            <input type="checkbox" id="option-cream" name="options" value="cream" data-price="500">
            <label for="option-cream">크림 추가 (+500원)</label>

            <input type="checkbox" id="option-syrup" name="options" value="syrup" data-price="300">
            <label for="option-syrup">시럽 추가 (+300원)</label>

            <input type="checkbox" id="option-decaf" name="options" value="decaf" data-price="0">
            <label for="option-decaf">디카페인 (+0원)</label>
          </div>
        </div>

        <!-- 6. 수량 선택 (숫자 입력) -->
        <div class="form-group">
          <label for="order-quantity">수량</label>
          <input type="number" id="order-quantity" name="quantity" min="1" max="10" value="1">
        </div>

        <!-- 7. 요청사항 (텍스트에어리어) -->
        <div class="form-group">
          <label for="special-requests">요청사항</label>
          <textarea id="special-requests" name="requests" rows="3" placeholder="요청사항이 있으시면 입력해주세요. (예: 얼음 적게 넣어주세요)"></textarea>
        </div>

        <!-- 8. 예상 금액 표시 영역 -->
        <div class="total-price-section">
          <span id="total-price-display">예상 금액: 0원</span>
        </div>

        <!-- 9 & 10. 주문하기 및 다시 작성 버튼 -->
        <div class="button-group">
          <button type="submit" id="submit-btn">주문하기</button>
          <button type="reset" id="reset-btn">다시 작성</button>
        </div>

      </form>

      <!-- 11. 주문 확인 메시지 영역 (주문 완료 시 JS로 채워짐) -->
      <div id="order-confirmation" class="hidden" style="display: none;"></div>

    </section>


    <!-- ==========================================
         [탭 2: 주문 내역 화면]
         접수된 주문 목록과 취소 기능, 총 주문액을 표시합니다.
    =========================================== -->
    <section id="history-tab" class="tab-content hidden">

      <!-- 주문이 없을 때 표시되는 빈 상태 안내 문구 -->
      <div id="empty-orders" class="empty-orders">
        아직 주문 내역이 없어요 ☕
      </div>

      <!-- 접수된 주문 카드들이 동적으로 추가되는 목록 컨테이너 -->
      <div id="order-list" class="order-list hidden"></div>

      <!-- 주문 목록 하단 총계 및 내역 모두 지우기 버튼 영역 -->
      <div id="history-summary" class="history-summary hidden">
        <span id="total-summary-text" class="total-summary-text">총 주문 금액: 0원 (0건)</span>
        <button type="button" id="clear-all-btn" class="clear-all-btn">내역 모두 지우기</button>
      </div>

    </section>

  </div>

  <!-- Supabase JS v2 라이브러리 CDN 연결 (script.js보다 먼저 로드되어야 합니다) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 외부 자바스크립트 파일 연결 -->
  <script src="script.js"></script>
</body>
</html>
